name: core-v04-pr-integrate

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feature/core-v04-typed-async-20260818'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Apply bounded integration edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          def read(path): return (root / path).read_text(encoding='utf-8')
          def write(path, value): (root / path).write_text(value, encoding='utf-8')
          def replace_once(path, old, new):
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match in {path}, got {count}')
              write(path, value.replace(old, new, 1))
          def append_once(path, marker, block):
              value = read(path)
              if marker in value:
                  return
              write(path, value.rstrip() + '\n\n' + block.strip() + '\n')

          main = 'server/cmd/webui-server/main.go'
          replace_once(main,
              '\trequestGuardHeader = "X-WebUI-Request"\n)',
              '\trequestGuardHeader = "X-WebUI-Request"\n\tstatusControlTimeout = 15 * time.Second\n)')
          replace_once(main,
              '\t\tctx, cancel = context.WithTimeout(context.Background(), 10*time.Second)\n\t\tdefer cancel()\n\t\tif _, err := app.runControl(ctx, maxControlOutput, "status"); err != nil {',
              '\t\tctx, cancel = context.WithTimeout(context.Background(), statusControlTimeout)\n\t\tdefer cancel()\n\t\tif _, err := app.runControl(ctx, maxControlOutput, "status"); err != nil {')
          replace_once(main,
              '\tctx, cancel := context.WithTimeout(r.Context(), 15*time.Second)\n\tdefer cancel()\n\toutput, err := a.runControl(ctx, maxControlOutput, "status")',
              '\tctx, cancel := context.WithTimeout(r.Context(), statusControlTimeout)\n\tdefer cancel()\n\toutput, err := a.runControl(ctx, maxControlOutput, "status")')
          replace_once(main,
              '\tregisterV03Handlers(mux, app)\n',
              '\tregisterV03Handlers(mux, app)\n\tregisterV04Handlers(mux, app)\n')

          readme = 'README.md'
          replace_once(readme, '`CORE_VERSION=0.3.1`', '`CORE_VERSION=0.4.0`')
          append_once(readme, '## Core v0.4 typed async extension', '''
          ## Core v0.4 typed async extension

          Core v0.4 keeps the base v1 and v0.3 contracts backward compatible and adds an opt-in `capabilities-v04` extension for workflows that need typed parameters without exposing an arbitrary command or path channel.

          Reusable primitives:

          - typed parameterized background jobs staged through private request files;
          - active-job dedupe on declared identity fields;
          - collection-backed reference parameters;
          - inventory-bound operations that re-resolve a selected identity before launch;
          - visibility-aware bounded polling without fake percentage progress;
          - one shared status timeout for HTTP status and server self-test.

          Modules that do not implement `capabilities-v04` continue to use the existing UI/API unchanged. See [Core v0.4 contract](docs/ROADMAP_V0_4.md).
          ''')

          append_once('docs/API_CONTRACT.md', '## v0.4 typed async extension', '''
          ## v0.4 typed async extension

          Core v0.4 adds a second optional extension. Existing base-v1 and v0.3 consumers remain valid.

          `GET /api/v1/v04/capabilities` reads `module-control capabilities-v04` with schema `root-module-webui.extensions.v2`.

          Typed jobs accept only declared `boolean`, `integer`, `string`, `enum`, or collection-backed `reference` parameters. `POST /api/v1/v04/jobs` validates the complete request, stages a private request file, and invokes only:

          ```text
          module-control job-run-file <declared-job> <private-request-file>
          ```

          Declared `dedupe_keys` coalesce only identical jobs that are still queued or running.

          `GET /api/v1/v04/reference?name=<declared-reference>` resolves the identity field of one declared v0.3 collection through `collection-get`; it is not a path/config browser.

          `POST /api/v1/v04/inventory-operation` accepts an operation name plus stable item ID. The server refreshes the bound inventory, requires that identity to still exist, then passes only the bound identity into the declared typed job.

          The shared frontend polls active work with bounded backoff and pauses polling while hidden. Declared phases are descriptive vocabulary only; no percentage progress is fabricated.
          ''')

          append_once('docs/PATTERN_LIBRARY.md', '## Typed asynchronous workflow primitives', '''
          ## Typed asynchronous workflow primitives

          Core v0.4 generalizes a safe pattern needed by return collection, backup/restore and diagnostics: browser inputs remain typed, references come from stable collection identities, inventory operations re-resolve the selected row, the server writes a private request file, and only one declared adapter job is invoked. Active duplicate work may be coalesced by declared keys. Domain phases and verification semantics remain module-owned.
          ''')

          append_once('docs/SECURITY_MODEL.md', '## v0.4 typed asynchronous boundary', '''
          ## v0.4 typed asynchronous boundary

          Typed job parameters are validated and serialized into a server-created private request file. The adapter receives a declared job name plus that private path. Inventory-bound operations re-read the declared inventory and collection-backed references accept only current declared identities. These primitives do not provide an arbitrary executable, shell command, SSH command, raw configuration or device-path input.
          ''')

          append_once('docs/ARCHITECTURE.md', '## Core v0.4 typed async flow', '''
          ## Core v0.4 typed async flow

          ```text
          browser typed form / inventory identity
                  |
                  v
          loopback server declaration + type/reference validation
                  |
                  +-- private request file
                  +-- active-job dedupe
                  v
          module-control job-run-file <declared-job> <private-request-file>
                  |
                  v
          bounded session job state/output
          ```

          The core owns typed transport, request staging and lifecycle. The module adapter owns domain mutation and verification.
          ''')

          append_once('docs/CORE_SYNC.md', '## v0.4 consumers', '''
          ## v0.4 consumers

          A consumer using typed async features pins `CORE_VERSION=0.4.0` and the exact template commit. Sync the v0.4 manifest as one unit, including `v04.js`, `v04.go` and their tests. A candidate built against an older core must be rebuilt and reverified after adopting v0.4.
          ''')

          append_once('docs/MIGRATION_GUIDE.md', '## Opting into v0.4 typed async', '''
          ## Opting into v0.4 typed async

          No migration is required for modules that remain on base-v1 or v0.3. To opt in, implement `capabilities-v04` plus only the declared `job-run-file` operations. Keep parameters typed and bounded and prefer collection-backed references or inventory-bound operations over free-form identifiers, paths or commands.
          ''')

          write('docs/WEBUI_CONTROL_TIMEOUT_ALIGNMENT.md', '''# WebUI control timeout alignment

          Status: implemented in core 0.4.0
          Origin: Pixel Thermal & Memory Control alpha4 device verification, 2026-08-17

          ## Resolution

          The standalone server now defines one named status-control timeout and uses it for both the normal HTTP status adapter call and the status portion of `-self-test`.

          Self-test therefore cannot kill a status adapter earlier than the runtime endpoint it validates. Action, inventory and background-job deadlines remain independently scoped.

          ## Consumer guidance

          Frequent status calls should remain inexpensive. Expensive validation belongs in verified caches, explicit inventories or background jobs.
          '''.replace('\n          ', '\n').lstrip())
          PY
          gofmt -w server/cmd/webui-server/main.go server/cmd/webui-server/v04.go server/cmd/webui-server/v04_test.go
      - name: Verify complete core
        run: ./scripts/verify.sh
      - name: Commit verified integration and remove this one-shot workflow
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/core-v04-pr-integrate.yml
          git add -A
          git commit -m 'feat(webui): integrate core v0.4 typed async primitives'
          git push origin HEAD:"$HEAD_REF"
