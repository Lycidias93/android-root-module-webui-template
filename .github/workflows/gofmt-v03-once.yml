name: gofmt-v03-once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Report v0.3 formatting diff
        run: gofmt -d server/cmd/webui-server/v03.go server/cmd/webui-server/v03_collection_digest.go server/cmd/webui-server/v03_test.go
