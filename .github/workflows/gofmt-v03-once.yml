name: gofmt-v03-once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Format v0.3 Go sources
        run: gofmt -w server/cmd/webui-server/v03.go server/cmd/webui-server/v03_collection_digest.go server/cmd/webui-server/v03_test.go
      - name: Push formatted helper branch
        run: |
          if git diff --quiet -- server/cmd/webui-server/v03.go server/cmd/webui-server/v03_collection_digest.go server/cmd/webui-server/v03_test.go; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/cmd/webui-server/v03.go server/cmd/webui-server/v03_collection_digest.go server/cmd/webui-server/v03_test.go
          git commit -m 'chore: gofmt v0.3 sources'
          git push --force origin HEAD:refs/heads/automation/gofmt-v03
