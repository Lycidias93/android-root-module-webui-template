name: ci

on:
  push:
    branches: ["main", "repo-maintenance/**", "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y python3 zip unzip

      - name: Verify
        run: ./scripts/verify.sh

      - name: WebUI race regressions
        run: node --test scripts/webui-race-regression.test.mjs

      - name: Build module
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v6
        with:
          name: standalone-webui-foundation
          path: |
            dist/*.zip
            dist/build-manifest.json
          if-no-files-found: error
