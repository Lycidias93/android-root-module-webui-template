name: core-v04-selfpatch

on:
  push:
    branches:
      - feature/core-v04-typed-async-20260818

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/core-v04-typed-async-20260818
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply deterministic integration patch
        run: python3 tools/apply_core_v04_patch.py
      - name: Format new Go sources
        run: gofmt -w server/cmd/webui-server/v04.go server/cmd/webui-server/v04_test.go
      - name: Verify complete core
        run: ./scripts/verify.sh
      - name: Commit verified result and remove patch transport
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/apply_core_v04_patch.py .github/workflows/core-v04-selfpatch.yml
          git add -A
          git commit -m 'feat(webui): add core v0.4 typed async primitives'
          git push origin HEAD:feature/core-v04-typed-async-20260818
